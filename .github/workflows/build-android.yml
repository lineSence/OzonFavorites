name: Build Android

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
      - fix/android-gradle-compat
      - feature/update-safe-storage

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FLUTTER_VERSION: '3.38.1'
      GRADLE_VERSION: '8.13'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Flutter project root
        id: project
        shell: bash
        run: |
          set -euo pipefail
          echo "Searching for pubspec.yaml..."
          PUBSPEC_PATH="$(find . -name pubspec.yaml -not -path '*/.dart_tool/*' -print -quit)"
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "No pubspec.yaml found in repository."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PUBSPEC_PATH")"
          PROJECT_DIR="${PROJECT_DIR#./}"
          if [ "$PROJECT_DIR" = "." ]; then PROJECT_DIR=""; fi
          echo "Detected Flutter project: ${PROJECT_DIR:-.}"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter analyze

      - name: Test
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter test

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Regenerate Gradle Wrapper
        working-directory: ${{ steps.project.outputs.project_dir }}/android
        shell: bash
        env:
          FLUTTER_ROOT: ${{ env.FLUTTER_ROOT }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle"
          cat > local.properties <<EOF
          flutter.sdk=${FLUTTER_ROOT}
          sdk.dir=${ANDROID_SDK_ROOT}
          EOF
          rm -f gradle/wrapper/gradle-wrapper.jar
          gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type all
          test -s gradle/wrapper/gradle-wrapper.jar

      - name: Configure release signing
        working-directory: ${{ steps.project.outputs.project_dir }}/android
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] || [ -z "${ANDROID_KEY_ALIAS}" ] || [ -z "${ANDROID_KEY_PASSWORD}" ]; then
            echo "ERROR: A permanent release keystore is required for an update-safe build."
            echo "Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD in GitHub Actions secrets."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release-keystore.jks
          test -s app/release-keystore.jks
          printf '%s\n' \
            "storePassword=${ANDROID_KEYSTORE_PASSWORD}" \
            "keyPassword=${ANDROID_KEY_PASSWORD}" \
            "keyAlias=${ANDROID_KEY_ALIAS}" \
            'storeFile=release-keystore.jks' \
            > key.properties
          echo "Using permanent release keystore."

      - name: Build release APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter build apk --release

      - name: Build split APKs
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter build apk --release --split-per-abi

      - name: Build AAB
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter build appbundle --release

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: pinzon-update-apk
          path: ${{ steps.project.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload split APKs
        uses: actions/upload-artifact@v4
        with:
          name: pinzon-update-split-apks
          path: ${{ steps.project.outputs.project_dir }}/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: pinzon-update-aab
          path: ${{ steps.project.outputs.project_dir }}/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
