name: Build Pinzon Android

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
      - fix/android-gradle-compat
      - refactor/ai-ready-v2

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.38.1'
  GRADLE_VERSION: '8.13'
  PUB_CACHE: ${{ github.workspace }}/.pub-cache
  PINZON_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build:
    name: Build, test and package Pinzon
    runs-on: ubuntu-latest
    concurrency:
      group: pinzon-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Flutter project root
        id: project
        shell: bash
        run: |
          set -euo pipefail
          PUBSPEC_PATH="$(find . -name pubspec.yaml -not -path '*/.dart_tool/*' -print -quit)"
          test -n "$PUBSPEC_PATH"
          PROJECT_DIR="$(dirname "$PUBSPEC_PATH")"
          PROJECT_DIR="${PROJECT_DIR#./}"
          [ "$PROJECT_DIR" = "." ] && PROJECT_DIR=""
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter analyze

      - name: Test
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter test

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Regenerate Gradle Wrapper
        working-directory: ${{ steps.project.outputs.project_dir }}/android
        shell: bash
        env:
          FLUTTER_ROOT: ${{ env.FLUTTER_ROOT }}
        run: |
          set -euo pipefail
          cat > local.properties <<EOF
          flutter.sdk=${FLUTTER_ROOT}
          sdk.dir=${ANDROID_SDK_ROOT}
          EOF
          rm -f gradle/wrapper/gradle-wrapper.jar
          gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type all
          test -s gradle/wrapper/gradle-wrapper.jar

      - name: Configure release signing
        working-directory: ${{ steps.project.outputs.project_dir }}/android
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p app
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release-keystore.jks
            printf '%s\n' "storePassword=${ANDROID_KEYSTORE_PASSWORD}" "keyPassword=${ANDROID_KEY_PASSWORD}" "keyAlias=${ANDROID_KEY_ALIAS}" 'storeFile=release-keystore.jks' > key.properties
          else
            keytool -genkeypair -v -keystore app/release-keystore.jks -storepass github-actions -keypass github-actions -alias pinzon -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Pinzon, OU=Build, O=Pinzon, L=Amsterdam, ST=NH, C=NL"
            printf '%s\n' 'storePassword=github-actions' 'keyPassword=github-actions' 'keyAlias=pinzon' 'storeFile=release-keystore.jks' > key.properties
          fi

      - name: Build optimized universal APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter build apk --release --dart-define=PINZON_BUILD_NUMBER=${PINZON_BUILD_NUMBER}

      - name: Rename APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Pinzon-build-${PINZON_BUILD_NUMBER}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pinzon-build-${{ env.PINZON_BUILD_NUMBER }}
          path: ${{ steps.project.outputs.project_dir }}/build/app/outputs/flutter-apk/Pinzon-build-${{ env.PINZON_BUILD_NUMBER }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        shell: bash
        run: |
          {
            echo "## Pinzon build #${PINZON_BUILD_NUMBER}"
            echo
            echo "Single optimized universal APK only."
            echo
            echo "Artifact: Pinzon-build-${PINZON_BUILD_NUMBER}.apk"
          } >> "$GITHUB_STEP_SUMMARY"
