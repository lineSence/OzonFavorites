name: Build Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Product Boards APK
    runs-on: ubuntu-latest
    env:
      FLUTTER_VERSION: '3.38.1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Flutter project root
        shell: bash
        run: |
          set -euo pipefail
          echo 'Searching for pubspec.yaml...'
          mapfile -t PUBSPECS < <(find . -type f -name pubspec.yaml -not -path './.git/*' | sort)
          if [ "${#PUBSPECS[@]}" -eq 0 ]; then
            echo 'ERROR: pubspec.yaml was not found in the repository.'
            echo 'Repository contents:'
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          fi
          if [ "${#PUBSPECS[@]}" -gt 1 ]; then
            echo 'ERROR: Multiple pubspec.yaml files were found:'
            printf '%s\n' "${PUBSPECS[@]}"
            exit 1
          fi

          PUBSPEC_PATH="${PUBSPECS[0]}"
          PROJECT_DIR="$(dirname "$PUBSPEC_PATH")"
          PROJECT_DIR="${PROJECT_DIR#./}"
          if [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR='.'
          fi

          echo "Detected Flutter project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Show project files
        shell: bash
        run: |
          set -euo pipefail
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo 'pubspec.yaml:'
          ls -la "$PROJECT_DIR"
          test -f "$PROJECT_DIR/pubspec.yaml"

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze

      - name: Test
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test

      - name: Build universal APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Build split APKs
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release --split-per-abi

      - name: Build Android App Bundle
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build appbundle --release

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: product-boards-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload split APKs
        uses: actions/upload-artifact@v4
        with:
          name: product-boards-split-apks
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: product-boards-aab
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days:
