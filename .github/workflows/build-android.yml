name: Build Android

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
      - fix/android-gradle-compat

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FLUTTER_VERSION: '3.38.1'
      GRADLE_VERSION: '8.13'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Flutter project root
        id: project
        shell: bash
        run: |
          set -euo pipefail
          echo "Searching for pubspec.yaml..."
          PUBSPEC_PATH="$(find . -name pubspec.yaml -not -path '*/.dart_tool/*' -print -quit)"
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "No pubspec.yaml found in repository."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PUBSPEC_PATH")"
          PROJECT_DIR="${PROJECT_DIR#./}"
          if [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR=""
          fi
          echo "Detected Flutter project: ${PROJECT_DIR:-.}"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter analyze

      - name: Test
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter test

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Regenerate Gradle Wrapper
        working-directory: ${{ steps.project.outputs.project_dir }}/android
        shell: bash
        env:
          FLUTTER_ROOT: ${{ env.FLUTTER_ROOT }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle"
          cat > local.properties <<EOF
          flutter.sdk=${FLUTTER_ROOT}
          sdk.dir=${ANDROID_SDK_ROOT}
          EOF
          rm -f gradle/wrapper/gradle-wrapper.jar
          gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type all
          test -s gradle/wrapper/gradle-wrapper.jar
          echo "Generated Gradle Wrapper:"
          ls -lh gradle/wrapper/gradle-wrapper.jar

      # Если в репозитории заданы секреты с постоянным keystore,
      # сборка подписывается им (можно публиковать в Google Play и
      # обновлять приложение поверх предыдущих артефактов).
      # Иначе генерируется одноразовый ключ: APK устанавливается,
      # но такой AAB нельзя публиковать в Play.
      - name: Configure release signing
        working-directory: ${{ steps.project.outputs.project_dir }}/android
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p app
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release-keystore.jks
            test -s app/release-keystore.jks
            printf '%s\n' \
              "storePassword=${ANDROID_KEYSTORE_PASSWORD}" \
              "keyPassword=${ANDROID_KEY_PASSWORD}" \
              "keyAlias=${ANDROID_KEY_ALIAS}" \
              'storeFile=release-keystore.jks' \
              > key.properties
            echo "Using permanent release keystore from secrets."
          else
            keytool -genkeypair -v \
              -keystore app/release-keystore.jks \
              -storepass github-actions \
              -keypass github-actions \
              -alias productboards \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Product Boards, OU=Build, O=Product Boards, L=Amsterdam, ST=NH, C=NL"
            printf '%s\n' \
              'storePassword=github-actions' \
              'keyPassword=github-actions' \
              'keyAlias=productboards' \
              'storeFile=release-keystore.jks' \
              > key.properties
            echo "No ANDROID_KEYSTORE_BASE64 secret; using throwaway CI keystore (installable APK only)."
          fi
          ls -lh app/release-keystore.jks key.properties

      - name: Build release APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter build apk --release

      - name: Build split APKs
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter build apk --release --split-per-abi

      - name: Build AAB
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter build appbundle --release

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: product-boards-apk
          path: ${{ steps.project.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload split APKs
        uses: actions/upload-artifact@v4
        with:
          name: product-boards-split-apks
          path: ${{ steps.project.outputs.project_dir }}/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: product-boards-aab
          path: ${{ steps.project.outputs.project_dir }}/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Build LLM analysis bundle
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="$RUNNER_TEMP/pinzon-llm-bundle"
          mkdir -p "$BUNDLE_DIR"
          git rev-parse HEAD > "$BUNDLE_DIR/SNAPSHOT_COMMIT.txt"
          git log --oneline --decorate --all > "$BUNDLE_DIR/GIT_HISTORY_ONELINE.txt"
          git remote -v > "$BUNDLE_DIR/GIT_REMOTES.txt"
          git status --short > "$BUNDLE_DIR/GIT_STATUS.txt"
          git ls-files > "$BUNDLE_DIR/REPOSITORY_FILE_LIST.txt"
          printf 'Repository: lineSence/OzonFavorites\nSnapshot commit: %s\nGenerated: %s\nHistory: full checkout (fetch-depth=0)\n' "$(git rev-parse HEAD)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$BUNDLE_DIR/BUNDLE_MANIFEST.txt"
          mkdir -p "$BUNDLE_DIR/repository"
          tar --exclude='./build' --exclude='./.dart_tool' --exclude='./android/.gradle' --exclude='./android/app/release-keystore.jks' -czf "$BUNDLE_DIR/pinzon-repository-with-git.tar.gz" .
          cp "$BUNDLE_DIR"/*.txt "$BUNDLE_DIR/repository/"
          tar -czf "$RUNNER_TEMP/pinzon-llm-analysis-bundle.tar.gz" -C "$BUNDLE_DIR" .

      - name: Upload LLM analysis bundle
        uses: actions/upload-artifact@v4
        with:
          name: pinzon-llm-analysis-bundle
          path: ${{ runner.temp }}/pinzon-llm-analysis-bundle.tar.gz
          if-no-files-found: error
