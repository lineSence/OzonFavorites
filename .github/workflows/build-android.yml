name: Build Android

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
      - fix/android-gradle-compat
      - refactor/ai-ready-v2

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.38.1'
  GRADLE_VERSION: '8.13'
  PUB_CACHE: ${{ github.workspace }}/.pub-cache
  PINZON_BUILD_NUMBER: ${{ github.run_number }}
  YANDEX_DISK_BUILD_DIR: Pinzon/Builds

a jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Flutter project root
        id: project
        shell: bash
        run: |
          set -euo pipefail
          PUBSPEC_PATH="$(find . -name pubspec.yaml -not -path '*/.dart_tool/*' -print -quit)"
          if [ -z "$PUBSPEC_PATH" ]; then exit 1; fi
          PROJECT_DIR="$(dirname "$PUBSPEC_PATH")"
          PROJECT_DIR="${PROJECT_DIR#./}"
          if [ "$PROJECT_DIR" = "." ]; then PROJECT_DIR=""; fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter pub get

      - name: Validate native assets
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          flutter pub cache repair
          flutter pub get

      - name: Analyze
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter analyze

      - name: Test
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter test

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Regenerate Gradle Wrapper
        working-directory: ${{ steps.project.outputs.project_dir }}/android
        shell: bash
        env:
          FLUTTER_ROOT: ${{ env.FLUTTER_ROOT }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle"
          cat > local.properties <<EOF
          flutter.sdk=${FLUTTER_ROOT}
          sdk.dir=${ANDROID_SDK_ROOT}
          EOF
          rm -f gradle/wrapper/gradle-wrapper.jar
          gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type all
          test -s gradle/wrapper/gradle-wrapper.jar

      - name: Configure release signing
        working-directory: ${{ steps.project.outputs.project_dir }}/android
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p app
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release-keystore.jks
            test -s app/release-keystore.jks
            printf '%s\n' "storePassword=${ANDROID_KEYSTORE_PASSWORD}" "keyPassword=${ANDROID_KEY_PASSWORD}" "keyAlias=${ANDROID_KEY_ALIAS}" 'storeFile=release-keystore.jks' > key.properties
          else
            keytool -genkeypair -v -keystore app/release-keystore.jks -storepass github-actions -keypass github-actions -alias productboards -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Pinzon, OU=Build, O=Pinzon, L=Amsterdam, ST=NH, C=NL"
            printf '%s\n' 'storePassword=github-actions' 'keyPassword=github-actions' 'keyAlias=productboards' 'storeFile=release-keystore.jks' > key.properties
          fi

      - name: Build ARM64 APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter build apk --release --split-per-abi --dart-define=PINZON_BUILD_NUMBER=${PINZON_BUILD_NUMBER}

      - name: Prepare ARM64 APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="build/app/outputs/flutter-apk"
          ARM64="$APK_DIR/app-arm64-v8a-release.apk"
          test -s "$ARM64"
          mv "$ARM64" "$APK_DIR/Pinzon-build-${PINZON_BUILD_NUMBER}-arm64-v8a.apk"

      - name: Upload ARM64 APK to Yandex Disk
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          YANDEX_DISK_TOKEN: ${{ secrets.YANDEX_DISK_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$YANDEX_DISK_TOKEN" ]; then
            echo "YANDEX_DISK_TOKEN is not configured" >&2
            exit 1
          fi

          API="https://cloud-api.yandex.net/v1/disk"
          APK="build/app/outputs/flutter-apk/Pinzon-build-${PINZON_BUILD_NUMBER}-arm64-v8a.apk"
          VERSION_PATH="${YANDEX_DISK_BUILD_DIR}/Pinzon-build-${PINZON_BUILD_NUMBER}-arm64-v8a.apk"
          LATEST_PATH="${YANDEX_DISK_BUILD_DIR}/Pinzon-latest-arm64-v8a.apk"

          curl -fsS -X PUT -H "Authorization: OAuth ${YANDEX_DISK_TOKEN}" \
            --data-urlencode "path=${YANDEX_DISK_BUILD_DIR}" \
            "${API}/resources" >/dev/null

          upload_file() {
            local path="$1"
            local encoded_path
            encoded_path="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$path")"
            local href
            href="$(curl -fsS -H "Authorization: OAuth ${YANDEX_DISK_TOKEN}" \
              "${API}/resources/upload?path=${encoded_path}&overwrite=true" | python3 -c 'import json,sys; print(json.load(sys.stdin)["href"])')"
            curl -fsS -T "$APK" "$href" >/dev/null
          }

          upload_file "$VERSION_PATH"
          upload_file "$LATEST_PATH"

          publish() {
            local path="$1"
            local encoded_path
            encoded_path="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$path")"
            curl -fsS -X PUT -H "Authorization: OAuth ${YANDEX_DISK_TOKEN}" \
              "${API}/resources/publish?path=${encoded_path}" >/dev/null || true
            curl -fsS -H "Authorization: OAuth ${YANDEX_DISK_TOKEN}" \
              "${API}/resources?path=${encoded_path}&fields=public_url" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("public_url", ""))'
          }

          VERSION_URL="$(publish "$VERSION_PATH")"
          LATEST_URL="$(publish "$LATEST_PATH")"

          echo "VERSION_URL=$VERSION_URL" >> "$GITHUB_ENV"
          echo "LATEST_URL=$LATEST_URL" >> "$GITHUB_ENV"

      - name: Build summary
        shell: bash
        run: |
          {
            echo "## 🚀 Pinzon build #${PINZON_BUILD_NUMBER}"
            echo
            echo "**APK:** \`Pinzon-build-${PINZON_BUILD_NUMBER}-arm64-v8a.apk\`"
            echo
            if [ -n "${VERSION_URL:-}" ]; then echo "[Скачать этот билд](${VERSION_URL})"; fi
            if [ -n "${LATEST_URL:-}" ]; then echo "[Скачать последний билд](${LATEST_URL})"; fi
          } >> "$GITHUB_STEP_SUMMARY"
