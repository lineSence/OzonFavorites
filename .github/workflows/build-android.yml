name: Build Pinzon Android

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
      - fix/android-gradle-compat
      - refactor/ai-ready-v2

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.38.1'
  GRADLE_VERSION: '8.13'
  PUB_CACHE: ${{ github.workspace }}/.pub-cache
  PINZON_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build:
    name: Build, test and package Pinzon
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Flutter project root
        id: project
        shell: bash
        run: |
          set -euo pipefail
          PUBSPEC_PATH="$(find . -name pubspec.yaml -not -path '*/.dart_tool/*' -print -quit)"
          test -n "$PUBSPEC_PATH"
          PROJECT_DIR="$(dirname "$PUBSPEC_PATH")"
          PROJECT_DIR="${PROJECT_DIR#./}"
          [ "$PROJECT_DIR" = "." ] && PROJECT_DIR=""
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter analyze

      - name: Test
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter test

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Regenerate Gradle Wrapper
        working-directory: ${{ steps.project.outputs.project_dir }}/android
        shell: bash
        env:
          FLUTTER_ROOT: ${{ env.FLUTTER_ROOT }}
        run: |
          set -euo pipefail
          cat > local.properties <<EOF
          flutter.sdk=${FLUTTER_ROOT}
          sdk.dir=${ANDROID_SDK_ROOT}
          EOF
          rm -f gradle/wrapper/gradle-wrapper.jar
          gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type all
          test -s gradle/wrapper/gradle-wrapper.jar

      - name: Configure release signing
        working-directory: ${{ steps.project.outputs.project_dir }}/android
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p app
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release-keystore.jks
            printf '%s\n' "storePassword=${ANDROID_KEYSTORE_PASSWORD}" "keyPassword=${ANDROID_KEY_PASSWORD}" "keyAlias=${ANDROID_KEY_ALIAS}" 'storeFile=release-keystore.jks' > key.properties
          else
            keytool -genkeypair -v -keystore app/release-keystore.jks -storepass github-actions -keypass github-actions -alias pinzon -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Pinzon, OU=Build, O=Pinzon, L=Amsterdam, ST=NH, C=NL"
            printf '%s\n' 'storePassword=github-actions' 'keyPassword=github-actions' 'keyAlias=pinzon' 'storeFile=release-keystore.jks' > key.properties
          fi

      - name: Build universal release APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter build apk --release --dart-define=PINZON_BUILD_NUMBER=${PINZON_BUILD_NUMBER}

      - name: Build split release APKs
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter build apk --release --split-per-abi --dart-define=PINZON_BUILD_NUMBER=${PINZON_BUILD_NUMBER}

      - name: Build release AAB
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter build appbundle --release --dart-define=PINZON_BUILD_NUMBER=${PINZON_BUILD_NUMBER}

      - name: Rename artifacts
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="build/app/outputs/flutter-apk"
          AAB_DIR="build/app/outputs/bundle/release"
          mv "$APK_DIR/app-release.apk" "$APK_DIR/Pinzon-build-${PINZON_BUILD_NUMBER}-universal.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            file="$APK_DIR/app-${abi}-release.apk"
            if [ -f "$file" ]; then mv "$file" "$APK_DIR/Pinzon-build-${PINZON_BUILD_NUMBER}-${abi}.apk"; fi
          done
          mv "$AAB_DIR/app-release.aab" "$AAB_DIR/Pinzon-build-${PINZON_BUILD_NUMBER}.aab"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pinzon-build-${{ env.PINZON_BUILD_NUMBER }}-apk
          path: ${{ steps.project.outputs.project_dir }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pinzon-build-${{ env.PINZON_BUILD_NUMBER }}-aab
          path: ${{ steps.project.outputs.project_dir }}/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        shell: bash
        run: |
          {
            echo "## Pinzon build #${PINZON_BUILD_NUMBER}"
            echo
            echo "Artifacts are stored in GitHub Actions."
            echo
            echo "- Universal APK: Pinzon-build-${PINZON_BUILD_NUMBER}-universal.apk"
            echo "- Split APKs: arm64-v8a / armeabi-v7a / x86_64"
            echo "- AAB: Pinzon-build-${PINZON_BUILD_NUMBER}.aab"
          } >> "$GITHUB_STEP_SUMMARY"
