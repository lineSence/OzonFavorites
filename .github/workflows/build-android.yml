name: Build Android

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
      - fix/android-gradle-compat
      - refactor/ai-ready-v2

permissions:
  contents: read
  actions: write

env:
  FLUTTER_VERSION: '3.38.1'
  GRADLE_VERSION: '8.13'
  PUB_CACHE: ${{ github.workspace }}/.pub-cache
  PINZON_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Flutter project root
        id: project
        shell: bash
        run: |
          set -euo pipefail
          PUBSPEC_PATH="$(find . -name pubspec.yaml -not -path '*/.dart_tool/*' -print -quit)"
          if [ -z "$PUBSPEC_PATH" ]; then exit 1; fi
          PROJECT_DIR="$(dirname "$PUBSPEC_PATH")"
          PROJECT_DIR="${PROJECT_DIR#./}"
          if [ "$PROJECT_DIR" = "." ]; then PROJECT_DIR=""; fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter pub get

      - name: Validate native assets
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          flutter pub cache repair
          flutter pub get

      - name: Analyze
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter analyze

      - name: Test
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter test

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Regenerate Gradle Wrapper
        working-directory: ${{ steps.project.outputs.project_dir }}/android
        shell: bash
        env:
          FLUTTER_ROOT: ${{ env.FLUTTER_ROOT }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle"
          cat > local.properties <<EOF
          flutter.sdk=${FLUTTER_ROOT}
          sdk.dir=${ANDROID_SDK_ROOT}
          EOF
          rm -f gradle/wrapper/gradle-wrapper.jar
          gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type all
          test -s gradle/wrapper/gradle-wrapper.jar

      - name: Configure release signing
        working-directory: ${{ steps.project.outputs.project_dir }}/android
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p app
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release-keystore.jks
            test -s app/release-keystore.jks
            printf '%s\n' "storePassword=${ANDROID_KEYSTORE_PASSWORD}" "keyPassword=${ANDROID_KEY_PASSWORD}" "keyAlias=${ANDROID_KEY_ALIAS}" 'storeFile=release-keystore.jks' > key.properties
          else
            keytool -genkeypair -v -keystore app/release-keystore.jks -storepass github-actions -keypass github-actions -alias productboards -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Pinzon, OU=Build, O=Pinzon, L=Amsterdam, ST=NH, C=NL"
            printf '%s\n' 'storePassword=github-actions' 'keyPassword=github-actions' 'keyAlias=productboards' 'storeFile=release-keystore.jks' > key.properties
          fi

      - name: Build ARM64 APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter build apk --release --split-per-abi --dart-define=PINZON_BUILD_NUMBER=${PINZON_BUILD_NUMBER}

      - name: Prepare ARM64 artifact
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="build/app/outputs/flutter-apk"
          ARM64="$APK_DIR/app-arm64-v8a-release.apk"
          test -s "$ARM64"
          mv "$ARM64" "$APK_DIR/Pinzon-build-${PINZON_BUILD_NUMBER}-arm64-v8a.apk"

      - name: Remove old Pinzon artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_ARTIFACTS: 5
        shell: bash
        run: |
          set -euo pipefail
          artifacts_json="$(gh api --paginate -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100")"

          echo "$artifacts_json" | python3 -c '
          import json, os, subprocess, sys
          data = json.load(sys.stdin)
          artifacts = [a for a in data.get("artifacts", []) if a.get("name", "").startswith("pinzon-build-")]
          artifacts.sort(key=lambda a: a.get("created_at", ""), reverse=True)
          keep = int(os.environ.get("KEEP_ARTIFACTS", "5"))
          repo = os.environ["GITHUB_REPOSITORY"]
          for artifact in artifacts[keep:]:
              aid = str(artifact["id"])
              name = artifact.get("name", aid)
              print(f"Deleting old artifact: {name} ({aid})")
              subprocess.run([
                  "gh", "api", "--method", "DELETE",
                  "-H", "Accept: application/vnd.github+json",
                  f"/repos/{repo}/actions/artifacts/{aid}"
              ], check=True)
          '

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: pinzon-build-${{ github.run_number }}-arm64-v8a
          path: ${{ steps.project.outputs.project_dir }}/build/app/outputs/flutter-apk/Pinzon-build-${{ github.run_number }}-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 7
