include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Стилевое правило о `const`-конструкторах @immutable-виджетов: код пишется
    # без жёсткой конст-дисциплины, а правило порождает каскад мелких правок.
    prefer_const_constructors_in_immutables: false
    # Flutter 3.38 рекомендует одиночный `_` для нескольких неиспользуемых
    # параметров. В проекте есть намеренно сокращённые callback-сигнатуры.
    unnecessary_underscores: false
    # Контекст используется только для навигации/диалогов после контролируемых
    # async-операций; правило не должно блокировать CI как информационное замечание.
    use_build_context_synchronously: false
    prefer_if_null_operators: false
    unused_local_variable: false
