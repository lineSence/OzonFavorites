name: pinzon
description: Visual archive of links for fast saving and later organization.
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  flutter_staggered_grid_view: ^0.7.0
  html: ^0.15.6
  http: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  share_plus: ^13.3.0
  sqflite: ^2.4.2+1
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
